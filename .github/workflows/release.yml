name: Release

# On a v* tag: build the engine for Windows, Linux and macOS, build the TypeScript packages, and attach one zip per OS to a
# GitHub release, each with a <zip>.sha256 beside it (sha256sum's format) that the npm package's first run checks the
# download against. The zips hold paths relative to the repository root, so they unzip over a clone. They never contain
# CC:Tweaked's ROM (its license does not allow redistribution): users build it with `node scripts/build-rom.mjs --download`.
# Then the desktop app's installers (CraftOS-<version>-<platform>...: Windows setup, macOS .dmg for each kind of Mac,
# Linux AppImage and .deb) are built from those zips, checked and attached to the same release.
on:
  push:
    # vscode-v* tags are the VS Code extension's (vscode-publish.yml), not an engine release
    tags: ["v*", "!vscode-v*"]
  workflow_dispatch:
    inputs:
      npm_only:
        # When a release's engines went out but its npm publish failed: run this on main with the tag (v1.2.3) to
        # publish only to npm from main's files, skipping the long engine builds. main's server.json must match it.
        description: "Only publish this existing release (a tag such as v0.3.0) to npm; leave empty for a full build"
        required: false
        default: ""
      tag:
        description: "With engines_from: the release to make (v1.2.3), at the commit this runs on (main)"
        required: false
        default: ""
      engines_from:
        # A release whose engine did not change (nothing under engine/ since): reuse that release's engine zips
        # instead of building them again on four runners. Everything else (desktop installers, npm, the registry)
        # is built from this commit as usual.
        description: "Reuse the engine zips of this earlier release (a tag such as v0.4.1); needs tag"
        required: false
        default: ""

permissions:
  contents: read

env:
  # The vcpkg commit the engine is known to build with. Bump it on purpose, not by accident.
  VCPKG_COMMIT: fa569792185110f25f68c333dd4fabca11c217ef

jobs:
  build:
    if: ${{ !inputs.npm_only && !inputs.engines_from }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            triplet: x64-windows
          # The oldest supported runner: the binary needs the glibc it was built against or newer, so building on
          # 22.04 (glibc 2.35) runs on 22.04, 24.04 and later. ubuntu-latest made it need 2.43.
          - os: ubuntu-22.04
            platform: linux-x64
            triplet: x64-linux
          # macOS: Apple silicon and Intel, each built on its own kind of runner. Both run on macOS 11 and newer
          # (engine/triplets), whatever the runner has.
          - os: macos-15
            platform: macos-arm64
            triplet: arm64-osx
          - os: macos-15-intel
            platform: macos-x64
            triplet: x64-osx
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Paths
        shell: bash
        run: |
          # RUNNER_TEMP is a native path on each OS (D:\a\_temp on Windows), so join with the native separator.
          if [ "$RUNNER_OS" = Windows ]; then sep='\'; else sep=/; fi
          echo "CRAFTOS_VCPKG=${RUNNER_TEMP}${sep}vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_CACHE=${RUNNER_TEMP}${sep}vcpkg-cache" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,${RUNNER_TEMP}${sep}vcpkg-cache,readwrite" >> "$GITHUB_ENV"

      - name: Linux packages vcpkg needs to build SDL2 and friends
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config curl zip unzip tar git \
            autoconf autoconf-archive automake libtool bison python3-venv python3-jinja2 linux-libc-dev \
            libx11-dev libxft-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libibus-1.0-dev libltdl-dev

      - name: macOS packages vcpkg needs to build SDL2 and friends
        if: runner.os == 'macOS'
        run: brew install ninja pkg-config autoconf autoconf-archive automake libtool

      - name: Get vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$CRAFTOS_VCPKG"
          git -C "$CRAFTOS_VCPKG" checkout --quiet "$VCPKG_COMMIT"
          mkdir -p "$VCPKG_CACHE"

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call "%CRAFTOS_VCPKG%\bootstrap-vcpkg.bat" -disableMetrics

      - name: Bootstrap vcpkg (Linux, macOS)
        if: runner.os != 'Windows'
        run: '"$CRAFTOS_VCPKG/bootstrap-vcpkg.sh" -disableMetrics'

      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_CACHE }}
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('engine/vcpkg.json', 'engine/triplets/*') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-

      # macOS runners share their addresses, so GitHub's API answers vcpkg's anonymous downloads with 403 (rate limit)
      # every so often. Give vcpkg a download script that sends the job's token, to api.github.com only.
      - name: Let vcpkg use the job's token for api.github.com
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf '%s' "$GH_TOKEN" > "$RUNNER_TEMP/gh-token"
          cat > "$RUNNER_TEMP/gh-fetch.sh" <<'EOF'
          #!/bin/bash
          # gh-fetch.sh <url> <file>. Anything but api.github.com fails here, and vcpkg then downloads it itself.
          case "$1" in
            https://api.github.com/*)
              exec curl -fsSL --retry 3 -H "Authorization: Bearer $(cat "$(dirname "$0")/gh-token")" -o "$2" "$1" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/gh-fetch.sh"
          echo "X_VCPKG_ASSET_SOURCES=clear;x-script,bash $RUNNER_TEMP/gh-fetch.sh {url} {dst}" >> "$GITHUB_ENV"

      - name: Build the engine (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call engine\build.cmd

      - name: Build the engine (Linux)
        if: runner.os == 'Linux'
        run: bash engine/build.sh

      # twice: a download that fails (the runners' DNS drops out now and then) stops vcpkg, and the second go picks
      # up from the packages already built
      - name: Build the engine (macOS)
        if: runner.os == 'macOS'
        run: bash engine/build.sh || bash engine/build.sh

      - name: Check the Linux binary finds its libraries
        if: runner.os == 'Linux'
        run: |
          ldd engine/build/craftos
          if ldd engine/build/craftos | grep -q "not found"; then exit 1; fi

      # Only liblua52.dylib (beside the binary, found through @loader_path) and what macOS itself ships may be needed.
      - name: Check the macOS binary finds its libraries
        if: runner.os == 'macOS'
        run: |
          otool -L engine/build/craftos engine/build/liblua52.dylib
          otool -l engine/build/craftos | grep -A2 LC_RPATH
          if otool -L engine/build/craftos engine/build/liblua52.dylib | grep '^[[:space:]]' \
            | grep -Ev '^[[:space:]]+(/usr/lib/|/System/Library/|@rpath/liblua52[.]dylib)'; then
            echo "the engine links a library a clean Mac does not have" >&2; exit 1
          fi
          otool -l engine/build/craftos | grep -q 'path @loader_path '

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Package
        shell: bash
        run: |
          name="craftos-mcp-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          stage="$RUNNER_TEMP/stage"
          rm -rf "$stage" && mkdir -p "$stage/engine/build"
          if [ "$RUNNER_OS" = Windows ]; then
            cp engine/build/craftos.exe engine/build/*.dll "$stage/engine/build/"
          else
            cp engine/build/craftos "$stage/engine/build/"
            find engine/build -maxdepth 1 \( -name '*.so*' -o -name '*.dylib' \) -exec cp -P {} "$stage/engine/build/" \;
          fi
          # Everything else the tools need at run time, in the repository layout.
          cp package.json package-lock.json LICENSE "$stage/"
          for f in README.md NOTICE.md; do if [ -f "$f" ]; then cp "$f" "$stage/"; fi; done
          for pkg in apps/* packages/*; do
            # apps/vscode is the extension: its own package, not built here and not part of the zip
            if [ ! -d "$pkg/dist" ]; then continue; fi
            mkdir -p "$stage/$pkg"
            cp "$pkg/package.json" "$stage/$pkg/"
            cp -r "$pkg/dist" "$stage/$pkg/"
            for extra in lua assets; do if [ -d "$pkg/$extra" ]; then cp -r "$pkg/$extra" "$stage/$pkg/"; fi; done
          done
          cp -r rom-overlay scripts "$stage/"
          # No CC:Tweaked files, ever.
          if [ -d "$stage/rom" ] || find "$stage" -name '*.jar' | grep -q .; then echo "CC:Tweaked files in the package" >&2; exit 1; fi
          mkdir -p dist-release
          if [ "$RUNNER_OS" = Windows ]; then
            (cd "$stage" && 7z a -tzip -r "$GITHUB_WORKSPACE/dist-release/$name.zip" . >/dev/null)
          else
            (cd "$stage" && zip -qry "$GITHUB_WORKSPACE/dist-release/$name.zip" .)
          fi
          # the SHA-256 the first run (scripts/npm/first-run.mjs) checks the download against; macOS has shasum only
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          (cd dist-release && $sum "$name.zip" > "$name.zip.sha256" && cat "$name.zip.sha256")
          ls -l dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist-release/*.zip
            dist-release/*.zip.sha256
          if-no-files-found: error

  # engines_from: the earlier release's zips under this release's names, as the build job's artifacts would be
  reuse:
    if: ${{ inputs.engines_from != '' && startsWith(inputs.tag, 'v') && !inputs.npm_only }}
    strategy:
      matrix:
        platform: [windows-x64, linux-x64, macos-arm64, macos-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch and rename
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ inputs.engines_from }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p old dist-release
          gh release download "$FROM" --repo "$GITHUB_REPOSITORY" --dir old             --pattern "craftos-mcp-$FROM-${{ matrix.platform }}.zip" --pattern "craftos-mcp-$FROM-${{ matrix.platform }}.zip.sha256"
          (cd old && sha256sum -c *.sha256)
          name="craftos-mcp-$TAG-${{ matrix.platform }}.zip"
          cp "old/craftos-mcp-$FROM-${{ matrix.platform }}.zip" "dist-release/$name"
          (cd dist-release && sha256sum "$name" > "$name.sha256" && cat "$name.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist-release/*.zip
            dist-release/*.zip.sha256
          if-no-files-found: error

  release:
    needs: [build, reuse]
    if: ${{ always() && (needs.build.result == 'success' || needs.reuse.result == 'success') && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -l dist-release
          # every zip has its checksum, and it holds
          for z in dist-release/*.zip; do test -f "$z.sha256" || { echo "no checksum for $z" >&2; exit 1; }; done
          (cd dist-release && sha256sum -c *.zip.sha256)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/*.zip dist-release/*.zip.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            # on a tag push the tag is there; from engines_from it is made here, at this run's commit
            gh release create "$TAG" dist-release/*.zip dist-release/*.zip.sha256 --repo "$GITHUB_REPOSITORY" --title "$TAG" --target "$GITHUB_SHA" --generate-notes
          fi

  # The desktop app (apps/desktop): an installer per platform with its own runtime, that platform's engine (from the
  # build job's zip) and the npm package's files inside, for people who do not want Node or a terminal. Each one is
  # built and then checked on its own platform (apps/desktop/scripts/check.mjs): the app starts, builds the ROM from
  # CC:Tweaked's jar as a first run does, runs a program, reads its screen and runs a test; on Windows the installer
  # is installed, used and uninstalled. A separate job from the engine zips, so a desktop problem never holds back
  # the zips or the npm package.
  desktop:
    needs: [build, reuse]
    if: ${{ always() && !inputs.npm_only && (needs.build.result == 'success' || needs.reuse.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist-release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The desktop app's own tools (Electron, electron-builder)
        working-directory: apps/desktop
        run: npm ci
      - name: A display for the check (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
      - name: Build the installer
        shell: bash
        run: |
          zip="$(ls dist-release/craftos-mcp-*-${{ matrix.platform }}.zip)"
          node apps/desktop/scripts/build.mjs --engine-zip "$zip" --out "$GITHUB_WORKSPACE/dist-desktop"
          ls -l dist-desktop
      - name: Check it installs, starts, runs a program and its tests
        shell: bash
        run: node apps/desktop/scripts/check.mjs "$GITHUB_WORKSPACE/dist-desktop"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            dist-desktop/CraftOS-*
            dist-desktop/latest*.yml
          if-no-files-found: error

  # Attach the installers to the release: what was built goes up even when one platform failed, and then the job
  # fails if anything is missing, so a release without one of its installers is never a quiet one.
  desktop-release:
    needs: [release, desktop]
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist-desktop
          merge-multiple: true
      - name: Attach the installers, then check every one is there
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -l dist-desktop
          gh release upload "$TAG" dist-desktop/* --clobber --repo "$GITHUB_REPOSITORY"
          version="${TAG#v}"
          missing=0
          # latest.yml and latest-linux.yml are what the installed app reads to update itself
          for want in \
            "CraftOS-$version-windows-x64-setup.exe" "CraftOS-$version-windows-x64-setup.exe.blockmap" latest.yml \
            "CraftOS-$version-macos-arm64.dmg" "CraftOS-$version-macos-x64.dmg" \
            "CraftOS-$version-linux-x64.AppImage" "CraftOS-$version-linux-x64.deb" latest-linux.yml; do
            if [ ! -s "dist-desktop/$want" ]; then echo "missing: $want" >&2; missing=1; fi
          done
          on_release="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '[.assets[].name | select(startswith("CraftOS-") or startswith("latest"))] | length')"
          echo "$on_release desktop files on the release"
          if [ "$on_release" -lt 8 ]; then echo "the release has $on_release desktop files, expected 8" >&2; missing=1; fi
          exit "$missing"

  # After the release has its engine zips (the package's first run downloads them), publish craftos-mcp to npm through
  # npm's Trusted Publishing: OIDC, no token. npmjs.com trusts this repository and this file name, so keep both.
  npm:
    needs: release
    if: ${{ always() && (needs.release.result == 'success' || startsWith(inputs.npm_only, 'v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.npm_only || inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@latest
      - name: The tag matches server.json, and its release has the engine zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want="v$(node -p "require('./server.json').version")"
          if [ "$want" != "$TAG" ]; then echo "tag $TAG but server.json says $want" >&2; exit 1; fi
          zips="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '[.assets[].name | select(endswith(".zip"))] | length')"
          if [ "$zips" -lt 4 ]; then echo "release $TAG has $zips engine zips, expected 4" >&2; exit 1; fi
      - name: Pack
        run: node scripts/pack-npm.mjs . --out "$RUNNER_TEMP/npm"
      - name: Publish (skipped when this version is already on npm)
        run: |
          version="$(node -p "require('./server.json').version")"
          if npm view "craftos-mcp@$version" version >/dev/null 2>&1; then echo "craftos-mcp $version is already published"; exit 0; fi
          # a publish npm is still processing isn't in `npm view` yet, and a second one gets E409 "previously staged"
          if ! npm publish "$RUNNER_TEMP"/npm/craftos-mcp-*.tgz --access public 2>"$RUNNER_TEMP/publish.err"; then
            cat "$RUNNER_TEMP/publish.err" >&2
            grep -q "previously staged version" "$RUNNER_TEMP/publish.err" || exit 1
            echo "craftos-mcp $version was published already and npm is still processing it"
          fi
      # The official MCP registry lists server.json under io.github.Akkiruk/craftos-mcp. GitHub's OIDC token proves the
      # namespace, so no device login. The registry checks the npm package exists, so this comes after the publish.
      - name: MCP registry
        run: |
          version="$(node -p "require('./server.json').version")"
          if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.Akkiruk/craftos-mcp" | grep -q "\"version\":\"$version\""; then
            echo "the registry already has $version"; exit 0
          fi
          for i in $(seq 20); do npm view "craftos-mcp@$version" version >/dev/null 2>&1 && break; sleep 30; done
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
