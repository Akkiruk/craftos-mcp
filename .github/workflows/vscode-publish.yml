name: Publish VS Code extension

# On a vscode-v* tag: package apps/vscode and publish it to the VS Code Marketplace through Trusted Publishing (OIDC,
# no token), then to Open VSX when the OVSX_PAT secret is set. The Marketplace's trusted publisher policy names this
# repository and this file, so keep its name. No tests here: run them locally first (docs/public-release.md).
on:
  push:
    tags: ["vscode-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: apps/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vscode/package-lock.json

      # apps/vscode has its own lockfile: it is not one of the root workspaces, so its tools stay out of the emulator's
      - run: npm ci

      # npm 12 skips dependency install scripts that allowScripts in package.json does not name (exact versions, so a
      # dependency bump needs `npx -y npm@12 install-scripts approve ...` again); npm 10 and 11 run them all. Either
      # way, make sure the two that matter ran: vsce-sign's puts its signing binary in bin/ (vsce publish needs it),
      # esbuild's checks its native binary. Both are safe to run twice.
      - name: Dependency install scripts
        run: |
          echo "npm $(npm --version)"
          test -x node_modules/@vscode/vsce-sign/bin/vsce-sign || node node_modules/@vscode/vsce-sign/src/postinstall.js
          test -x node_modules/@vscode/vsce-sign/bin/vsce-sign
          npx esbuild --version

      # The browser engine for the web extension (package.json `browser`): engine/build-web.sh with emsdk pinned to
      # its EMSDK_VERSION. emsdk (with Emscripten's port cache, SDL2 among them) and the build folder (Poco for wasm32,
      # built once) are cached, so a release only recompiles the engine.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
          actions-cache-folder: emsdk-cache
      - uses: actions/cache@v4
        with:
          path: engine/build-web
          key: web-engine-${{ hashFiles('engine/build-web.sh', 'engine/web/**', 'engine/CMakeLists.txt', 'engine/src/**', 'engine/api/**', 'engine/craftos2-lua/**') }}
          restore-keys: web-engine-
      - name: Build the browser engine
        working-directory: .
        run: |
          sudo apt-get install -y -qq ninja-build >/dev/null
          bash engine/build-web.sh
          echo "CRAFTOS_WEB_BUILD_DIR=$PWD/engine/build-web" >> "$GITHUB_ENV"

      # vscode:prepublish typechecks and bundles (esbuild.mjs takes the engine from CRAFTOS_WEB_BUILD_DIR)
      - run: npx vsce package --no-dependencies --out craftos-mcp.vsix

      # without the engine the web extension can only say it has none: never publish that
      - name: The package has the browser engine
        run: |
          unzip -l craftos-mcp.vsix | grep -q 'extension/dist/web/runtime/craftos.wasm'
          unzip -l craftos-mcp.vsix | grep -q 'extension/dist/web/runtime/craftos.js'
          unzip -l craftos-mcp.vsix | grep -q 'extension/dist/web/overlay.pack'

      - run: npx vsce publish --oidc --no-dependencies --packagePath craftos-mcp.vsix

      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: npx -y ovsx@1.4.0 publish craftos-mcp.vsix -p "$OVSX_PAT"
