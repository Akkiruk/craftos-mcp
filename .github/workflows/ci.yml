name: CI

# Builds the TypeScript packages and checks formatting on every push and pull request. The engine is built by the
# Release workflow; the emulator's tests need it and a ROM, so run them locally with `npm test` after `npm run setup`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run format:check
